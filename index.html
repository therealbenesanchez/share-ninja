<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Share Ninja — Climb Randomizer</title>
<style>
  :root{
    --ink:#101322; --panel:#1a1e33; --panel2:#232849;
    --text:#eef0fa; --muted:#9aa0c3;
    --accent:#e8b64c; --danger:#d64545;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--ink); color:var(--text);
    font-family:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px; padding:10px 16px; background:var(--panel);
    border-bottom:1px solid #2c3157; flex-wrap:wrap;
  }
  .brand{font-weight:900; letter-spacing:.18em; font-size:15px; text-transform:uppercase;}
  .brand em{font-style:normal; color:var(--accent);}
  .controls{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  select,button{
    font:inherit; font-weight:700; color:var(--text);
    background:var(--panel2); border:1px solid #3a4070;
    border-radius:10px; padding:8px 14px; cursor:pointer;
  }
  select:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  button.primary{background:var(--accent); color:#241a05; border-color:var(--accent);}
  button:disabled{opacity:.45; cursor:not-allowed;}
  main{position:relative; flex:1; min-height:0;}
  canvas{display:block; width:100%; height:100%;}
  #hud{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; align-items:center; gap:10px; padding:10px 14px;
    background:linear-gradient(transparent, rgba(10,12,24,.85) 40%);
    flex-wrap:wrap;
  }
  #sharedList{display:flex; gap:6px; flex-wrap:wrap;}
  .chip{
    background:var(--panel2); border:1px solid #3a4070; color:var(--muted);
    border-radius:999px; padding:4px 10px; font-size:12px; font-weight:700;
  }
  .chip b{color:var(--accent);}
  /* wall announcement banner */
  #banner{
    position:absolute; top:16%; left:50%; transform:translateX(-50%);
    text-align:center; pointer-events:none;
    background:rgba(10,12,24,.82); border:1px solid #3a4070;
    border-radius:16px; padding:18px 34px;
    box-shadow:0 12px 44px rgba(0,0,0,.5);
    animation:bannerPop .45s cubic-bezier(.2,1.4,.4,1) both;
  }
  #banner .eyebrow{margin-bottom:6px;}
  #bannerWall{
    font-size:clamp(24px,5vw,38px); font-weight:900;
    text-transform:uppercase; letter-spacing:.08em;
  }
  @keyframes bannerPop{
    from{opacity:0; transform:translateX(-50%) scale(.8);}
    to{opacity:1; transform:translateX(-50%) scale(1);}
  }
  @media (prefers-reduced-motion: reduce){ #banner{animation:none;} }
  /* overlays */
  .overlay{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(8,10,22,.72); backdrop-filter:blur(3px); padding:20px;
  }
  .hidden{display:none;}
  .card{
    background:var(--panel); border:1px solid #3a4070; border-radius:18px;
    padding:28px 32px; text-align:center; max-width:420px; width:100%;
    box-shadow:0 18px 60px rgba(0,0,0,.5);
  }
  .eyebrow{
    text-transform:uppercase; letter-spacing:.22em; font-size:11px;
    color:var(--accent); font-weight:800; margin-bottom:10px;
  }
  .card h1{font-size:clamp(28px,6vw,44px); line-height:1.05; margin-bottom:8px; overflow-wrap:anywhere;}
  .card p{color:var(--muted); margin-bottom:20px;}
  .card .row{display:flex; gap:10px; justify-content:center; flex-wrap:wrap;}
  .order{list-style:none; margin:0 0 18px; text-align:left; max-height:180px; overflow:auto;}
  .order li{padding:4px 0; border-bottom:1px dashed #33396a; font-weight:700;}
  .order li span{color:var(--accent); display:inline-block; width:2em;}
  textarea{
    width:100%; min-height:170px; resize:vertical; font:inherit; color:var(--text);
    background:var(--ink); border:1px solid #3a4070; border-radius:10px; padding:10px;
    margin-bottom:14px;
  }
  .hint{font-size:12px; color:var(--muted); margin-bottom:12px;}
  @media (prefers-reduced-motion: reduce){ .card{box-shadow:none;} }
</style>
</head>
<body>
<header>
  <div class="brand">SHARE <em>NINJA</em></div>
  <div class="controls">
    <label for="wallSelect" style="font-size:12px;color:var(--muted);font-weight:700;">Wall</label>
    <select id="wallSelect" aria-label="Choose wall theme"></select>
    <button id="rosterBtn">Edit roster</button>
  </div>
</header>

<main>
  <canvas id="cv"></canvas>
  <div id="banner" class="hidden" aria-live="polite">
    <div class="eyebrow">Tonight's wall</div>
    <div id="bannerWall"></div>
  </div>
  <div id="hud">
    <button id="startBtn" class="primary">Start the climb</button>
    <div id="sharedList" aria-live="polite"></div>
  </div>

  <div id="winOverlay" class="overlay hidden">
    <div class="card">
      <div class="eyebrow">Reached the top</div>
      <h1 id="winnerName"></h1>
      <p>It's your turn to share!</p>
      <div class="row">
        <button id="againBtn" class="primary">Climb down &amp; race again</button>
      </div>
    </div>
  </div>

  <div id="doneOverlay" class="overlay hidden">
    <div class="card">
      <div class="eyebrow">Mission complete</div>
      <h1>Everyone shared</h1>
      <ol class="order" id="finalOrder"></ol>
      <div class="row">
        <button id="resetBtn" class="primary">Start over</button>
      </div>
    </div>
  </div>

  <div id="rosterOverlay" class="overlay hidden">
    <div class="card" style="text-align:left;">
      <div class="eyebrow">Roster</div>
      <p class="hint">One student per line. Saving resets the current mission.</p>
      <textarea id="rosterText" spellcheck="false"></textarea>
      <div class="row">
        <button id="rosterCancel">Cancel</button>
        <button id="rosterSave" class="primary">Save roster</button>
      </div>
    </div>
  </div>
</main>

const BG_TINT = { castle:[0.45,0.72], neon:[0.5,0.74], frost:[0.28,0.55] };
const bgImages = {};
for (const [k, src] of Object.entries(BG_DATA)){
  const im = new Image();
  im.src = src;
  bgImages[k] = im;
}

/* ---------------- state ---------------- */
let roster = DEFAULT_ROSTER.slice();
let shared = [];                 // names in share order
let ninjas = [];                 // active climbers
let phase = "idle";              // idle | racing | winning | winner | descending | done
let winner = null;
let themeKey = "castle";
let hazTimer = 1.2;
let announceT = 0;
let megaTimer = 0;
let powerTimer = 0;
let wallHoles = [];
let fia = null;        // baby Fia event state
let fiaTimer = -1;     // seconds until Fia falls this round (-1 = not this round)
let shakeT = 0;
let anims = [];                  // hazard animations
let floaters = [];               // floating text
let particles = [];              // celebration / ambient
let winTimer = 0;
let t0 = performance.now();
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* ---------------- dom ---------------- */
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const startBtn = document.getElementById("startBtn");
const wallSelect = document.getElementById("wallSelect");
const sharedList = document.getElementById("sharedList");
const winOverlay = document.getElementById("winOverlay");
const winnerName = document.getElementById("winnerName");
const againBtn = document.getElementById("againBtn");
const doneOverlay = document.getElementById("doneOverlay");
const finalOrder = document.getElementById("finalOrder");
const resetBtn = document.getElementById("resetBtn");
const rosterBtn = document.getElementById("rosterBtn");
const rosterOverlay = document.getElementById("rosterOverlay");
const rosterText = document.getElementById("rosterText");
const rosterSave = document.getElementById("rosterSave");
const rosterCancel = document.getElementById("rosterCancel");
const banner = document.getElementById("banner");
const bannerWall = document.getElementById("bannerWall");

const surpriseOpt = document.createElement("option");
surpriseOpt.value = "random"; surpriseOpt.textContent = "🎲 Surprise wall";
wallSelect.appendChild(surpriseOpt);
for (const [k,t] of Object.entries(THEMES)){
  const o = document.createElement("option");
  o.value = k; o.textContent = t.label;
  wallSelect.appendChild(o);
}
wallSelect.value = "random";

/* ---------------- helpers ---------------- */
const rand = (a,b) => a + Math.random()*(b-a);
const pick = arr => arr[Math.floor(Math.random()*arr.length)];
const easeOut = t => 1-Math.pow(1-t,3);
const easeIn  = t => t*t;
const theme = () => THEMES[themeKey];

function resize(){
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  const r = cv.getBoundingClientRect();
  cv.width = Math.round(r.width*dpr);
  cv.height = Math.round(r.height*dpr);
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener("resize", resize);

function layout(){
  const w = cv.clientWidth, h = cv.clientHeight;
  const wallL = Math.max(40, w*0.08), wallR = w - Math.max(40, w*0.08);
  const topPad = 78, botPad = 78;
  return {w,h,wallL,wallR,topPad,botPad,
    yToPx: y => h - botPad - (y/GOAL)*(h - topPad - botPad)};
}

function laneX(i, n, L){
  const pad = 34;
  const span = (L.wallR-pad) - (L.wallL+pad);
  if (n === 1) return L.wallL + pad + span/2;
  return L.wallL + pad + span * (i/(n-1));
}

/* ---------------- mission control ---------------- */
function remaining(){ return roster.filter(n => !shared.includes(n)); }

function setupRound(){
  const names = remaining();
  ninjas = names.map((name,i) => ({
    name,
    color: NINJA_COLORS[roster.indexOf(name) % NINJA_COLORS.length],
    y: 0, state:"wait", timer: rand(.2,.9),
    gain:0, t:0, dur:0, from:0, to:0, hookGone:false,
    stunT:0, wobble: Math.random()*10, clutch:0, rescued:false, ufoWin:false,
    boostT:0, rocket:false
  }));
  anims = []; floaters = []; winner = null; wallHoles = [];
  fia = null; fiaTimer = -1;
}

function updateHUD(){
  sharedList.innerHTML = "";
  shared.forEach((n,i) => {
    const c = document.createElement("span");
    c.className = "chip";
    c.innerHTML = `<b>${i+1}</b> ${escapeHtml(n)}`;
    sharedList.appendChild(c);
  });
  const left = remaining().length;
  if (phase === "idle"){
    startBtn.classList.remove("hidden");
    startBtn.disabled = false;
    startBtn.textContent = shared.length === 0 ? "Start the climb" :
      (left === 1 ? `Last climb — ${remaining()[0]}` : "Start the next climb");
  } else {
    startBtn.disabled = true;
    startBtn.textContent = phase === "descending" ? "Climbing down…" : "Climbing…";
  }
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function startRace(){
  if (phase !== "idle") return;
  if (wallSelect.value === "random"){
    const keys = Object.keys(THEMES);
    let next = pick(keys);
    while (keys.length > 1 && next === themeKey) next = pick(keys);
    themeKey = next;
  } else {
    themeKey = wallSelect.value;
  }
  setupRound();
  bannerWall.textContent = theme().label;
  banner.classList.remove("hidden");
  phase = "announce";
  announceT = 2.4;
  updateHUD();
}

function crown(n){
  winner = n;
  n.y = GOAL; n.state = "top"; n.vaultT = 0;
  phase = "winning"; winTimer = 1.1;
  ninjas.forEach(o => {
    if (o !== n){
      if (o.state === "eaten"){ o.y = 0; }
      o.state = "freeze";
    }
  });
  anims = anims.filter(a => a.kind !== "trex");
  burst(n);
}

function burst(n){
  if (reduceMotion) return;
  const L = layout();
  const x = n.px ?? laneX(ninjas.indexOf(n), ninjas.length, L);
  const y = L.yToPx(GOAL);
  for (let i=0;i<46;i++){
    particles.push({
      x, y, vx: rand(-90,90), vy: rand(-150,-20),
      life: rand(1.2,2.2), age:0, size: rand(3,6),
      color: i%3===0 ? "#ffffff" : theme().particleColor, spin: rand(0,6.28)
    });
  }
}

function confirmWinner(){
  winOverlay.classList.add("hidden");
  phase = "descending";
  ninjas.forEach(n => { if (n !== winner) n.state = "descend"; });
  winner.state = "gone"; winner.goneT = 0;
  updateHUD();
}

function finishDescent(){
  shared.push(winner.name);
  winner = null;
  if (remaining().length === 0){
    phase = "done";
    finalOrder.innerHTML = shared.map((n,i)=>`<li><span>${i+1}.</span>${escapeHtml(n)}</li>`).join("");
    doneOverlay.classList.remove("hidden");
  } else {
    phase = "idle";
  }
  updateHUD();
}

function resetAll(){
  shared = []; winner = null; phase = "idle";
  doneOverlay.classList.add("hidden");
  winOverlay.classList.add("hidden");
  setupRound();
  updateHUD();
}

/* ---------------- hazards ---------------- */
function clutchDeny(n){
  if (rocketSave(n)) return;
  const hz = pick(theme().hazards);
  const wiped = Math.random() < 0.4;
  const drop = rand(20, 32);
  n.state = "fall";
  n.from = n.y;
  n.to = wiped ? 0 : Math.max(0, n.y - drop);
  n.t = 0; n.dur = wiped ? 0.8 : 0.55;
  n.stunT = rand(.8, 1.4) + (wiped ? 0.4 : 0);
  const L = layout();
  floaters.push({x: (n.px ?? 0), y: L.yToPx(n.y)-58, text: wiped ? "SO CLOSE… TOTAL WIPEOUT!" : "SO CLOSE!", age:0, life:1.8});
  floaters.push({x: (n.px ?? 0), y: L.yToPx(n.y)-34, text: hz.label, age:0, life:1.6});
}

function inHole(yW, px, L){
  const W = L.wallR - L.wallL;
  for (const hZ of wallHoles){
    const x0 = L.wallL + hZ.fx*W, x1 = L.wallL + (hZ.fx + hZ.fw)*W;
    if (px >= x0 && px <= x1 && Math.abs(yW - hZ.y) < hZ.r) return true;
  }
  return false;
}

function destroyWall(fx, fw, yWorld, r){
  const jit = [];
  for (let i=0;i<12;i++) jit.push(rand(0.7, 1.3));
  wallHoles.push({fx, fw, y:yWorld, r0:r, r, age:0, rebuildT: rand(9, 13), jit});
  // rubble burst
  const L = layout();
  const cx = L.wallL + (fx + fw/2)*(L.wallR - L.wallL);
  const cy = L.yToPx(yWorld);
  if (!reduceMotion){
    for (let i=0;i<14;i++){
      particles.push({x:cx+rand(-50,50), y:cy+rand(-20,20), vx:rand(-90,90), vy:rand(-70,40),
        life:rand(.8,1.6), age:0, size:rand(2,5), color:"#9a9aa6", spin:rand(0,6.28)});
    }
  }
}

function kaijuStrike(yBand, r, fx, fw, hz){
  const L = layout();
  const W = L.wallR - L.wallL;
  const x0 = L.wallL + fx*W, x1 = L.wallL + (fx + fw)*W;
  for (const n of ninjas){
    if (n.state==="top" || n.state==="freeze" || n.state==="descend" || n.state==="eaten") continue;
    if (Math.abs(n.y - yBand) < r + 3 && (n.px ?? -9999) >= x0 && n.px <= x1){
      applyHazard(n, hz);
    }
  }
}

function rocketSave(n){
  if (!n.rocket) return false;
  n.rocket = false;
  n.state = "wait"; n.timer = 0.35;
  n.y = Math.min(GOAL - 3, n.y + 4);
  anims.push({kind:"flame", n, t:0, done:false});
  const L = layout();
  floaters.push({x:(n.px ?? 0), y: L.yToPx(n.y)-40, text:"🚀 ROCKET SAVE!", age:0, life:1.6, save:true});
  return true;
}

function spawnPower(){
  const targets = ninjas.filter(n => n.y < 85 &&
    (n.state==="wait" || n.state==="zip" || n.state==="hook" || n.state==="stun"));
  if (!targets.length) return;
  const n = pick(targets);
  const ptype = Math.random() < 0.5 ? "speed" : "rocket";
  anims.push({kind:"power", ptype, n, x:(n.px ?? 100) + rand(-10,10), y:-16, vy:rand(130,180), done:false});
}

function megaBanner(text){
  const L = layout();
  floaters.push({x: L.w/2, y: L.topPad + 70, text, age:0, life:2.4, big:true});
}

function triggerMega(){
  const L = layout();
  const climbing = n => (n.state==="wait" || n.state==="zip" || n.state==="hook" || n.state==="stun");
  if (theme().kaiju){
    if (pick(["godzilla","kong"]) === "godzilla"){
      megaBanner("🔥 GODZILLA'S ATOMIC BREATH!");
      anims.push({kind:"godzilla", t:0, dur:2.4, yBand: rand(30, 80), fired:false, done:false});
    } else {
      megaBanner("🦍 KONG SMASH!");
      anims.push({kind:"kong", t:0, dur:2.1, yBand: rand(25, 75), punched:false, done:false});
    }
    return true;
  }
  // explicit odds: shark 10%, trex 10%, cheese 15%, geese 15%, climb 7%, quiet 43%
  const trexTargets = ninjas.filter(n => n.y > 60 && climbing(n));
  const roll = Math.random();
  let choice;
  if (roll < 0.10)      choice = "shark";
  else if (roll < 0.20) choice = trexTargets.length ? "trex" : null;
  else if (roll < 0.35) choice = "cheese";
  else if (roll < 0.50) choice = "flock";
  else if (roll < 0.57) choice = "climb";
  else                  choice = null;
  if (!choice) return false;

  if (choice === "trex"){
    const victim = trexTargets.slice().sort((a,b) => b.y - a.y)[0];
    const side = victim.px < L.w/2 ? -1 : 1;
    anims.push({kind:"trex", n:victim, t:0, side, chomped:false, yw:victim.y, done:false});
    megaBanner("🦖 T-REX ATTACK!");
  } else if (choice === "shark"){
    megaBanner("🦈 GREAT WHITE BREACH!");
    const victims = ninjas.filter(n => n.y > 15 && climbing(n));
    const shuffled = victims.slice().sort(() => Math.random() - 0.5);
    const count = Math.min(shuffled.length, 2 + (Math.random() < 0.5 ? 1 : 0));
    const targets = shuffled.slice(0, count);
    const fromLeft = Math.random() < 0.5;
    anims.push({kind:"shark",
      hz:{label:"Shark takedown!", drop:[20,30], stun:[.8,1.5], wipeout:1},
      dir: fromLeft ? 1 : -1, t:0, dur:1.8, p:0,
      x0: fromLeft ? -180 : L.w+180,
      x1: fromLeft ? L.w+180 : -180,
      apex: rand(0.4, 0.65),
      targets, hit:new Set(), done:false});
  } else if (choice === "cheese"){
    megaBanner("🧀 SURPRISE CHEESE STORM!");
    const hz = {label:"Bonked by cheese!", drop:[8,16], stun:[.5,1.0], wipeout:.3};
    const actives = ninjas.filter(n => n.y > 5 && climbing(n));
    for (let i=0;i<10;i++){
      const x = rand(L.wallL+20, L.wallR-20);
      let target = null;
      for (const n of actives){
        if (Math.abs((n.px ?? -999) - x) < 16 && Math.random() < 0.8){ target = n; break; }
      }
      anims.push({kind:"cheese", hz, n:target, x, y:-20 - rand(0,60),
        vy:rand(170,260), delay:rand(0,1.6), spin:rand(0,6.28), done:false});
    }
  } else if (choice === "climb"){
    megaBanner("🎤 IT'S THE CLIIIIMB!");
    anims.push({kind:"climb", t:0, dur:3.0,
      hz:{label:"Swept away by the ballad!", drop:[30,40], stun:[.9,1.6], wipeout:1},
      yw:112, hit:new Set(), done:false});
  } else {
    megaBanner("🪿 GOOSE FLOCK INCOMING!");
    const fromLeft = Math.random() < 0.5;
    anims.push({kind:"flock",
      hz:{label:"Whisked by geese!", drop:[10,18], stun:[.5,1.1]},
      dir: fromLeft ? 1 : -1, x: fromLeft ? -140 : L.w+140,
      yWorld: rand(30, 88), speed: rand(240, 320),
      flap:0, hit:new Set(), done:false});
  }
  return true;
}

function spawnHazard(){
  const targets = ninjas.filter(n => n.y > 12 && (n.state==="wait" || n.state==="zip"));
  if (!targets.length || Math.random() < 0.35) return;
  // leaders draw more heat — hazards prefer whoever is highest on the wall
  const pool = [];
  for (const t of targets){
    const wgt = 1 + (t.y > 60 ? 1 : 0) + (t.y > 80 ? 2 : 0);
    for (let i=0;i<wgt;i++) pool.push(t);
  }
  const n = pick(pool);
  const hz = pick(theme().hazards);
  if (hz.kind === "slip"){
    applyHazard(n, hz);
    return;
  }
  const L = layout();
  const tx = n.px ?? laneX(ninjas.indexOf(n), ninjas.length, L);
  if (hz.kind === "bird"){
    const fromLeft = Math.random() < .5;
    anims.push({hz, n, kind:"bird",
      x: fromLeft ? -30 : L.w+30, dir: fromLeft ? 1 : -1,
      speed: rand(260, 360), flap:0, done:false});
  } else { // dropper
    anims.push({hz, n, kind:"dropper", x: tx + rand(-4,4), y: -20, vy: rand(220,300), done:false});
  }
}

function canCatch(n){
  return n && (n.state==="wait"||n.state==="zip"||n.state==="hook"||n.state==="stun"||n.state==="fall") && n.y > 8;
}

function dropFia(){
  if (fia || phase !== "racing") return false;
  let pool = ninjas.filter(n => canCatch(n) && n.y > 25);
  if (!pool.length) pool = ninjas.filter(canCatch);
  if (!pool.length) return false;
  const n = pick(pool);
  const L = layout();
  fia = {phase:"falling", n, x:n.px, y:-30, vy:90, t:0};
  megaBanner("👶 BABY FIA IS FALLING!");
  return true;
}

function updateFia(dt, L){
  if (!fia) return;
  fia.t += dt;
  if (fia.phase === "falling"){
    let n = fia.n;
    if (!canCatch(n)){
      // original catcher got taken out — nearest available ninja dives in
      const pool = ninjas.filter(canCatch);
      if (pool.length){
        n = fia.n = pool.sort((a,b) => Math.abs(a.px - fia.x) - Math.abs(b.px - fia.x))[0];
      }
    }
    if (canCatch(n)) fia.x += (n.px - fia.x) * Math.min(1, dt*3);
    fia.vy = Math.min(220, fia.vy + 120*dt);
    fia.y += fia.vy*dt;
    if (canCatch(n) && fia.y >= L.yToPx(n.y) - 26){
      fia.phase = "carried";
      n.state = "carry";
      floaters.push({x: n.px, y: L.yToPx(n.y)-56, text:`${n.name} caught Fia!`, age:0, life:2.0, save:true});
    } else if (fia.y >= L.yToPx(0) - 6){
      // nobody could catch — a soft landing cushion pops out
      fia.phase = "ground"; fia.t = 0; fia.gx = fia.x;
      floaters.push({x: fia.x, y: L.yToPx(0)-50, text:"Soft landing! Fia is okay ♥", age:0, life:2.2, save:true});
    }
  }
}

function applyHazard(n, hz){
  if (phase !== "racing") return;
  if (n.state === "top" || n.state === "freeze" || n.state === "descend" || n.state === "eaten" || n.state === "carry") return;
  if (rocketSave(n)) return;
  const drop = rand(hz.drop[0], hz.drop[1]);
  const wiped = !!(hz.wipeout && Math.random() < hz.wipeout);
  n.state = "fall";
  n.from = n.y;
  n.to = wiped ? 0 : Math.max(0, n.y - drop);
  const dist = n.from - n.to;
  n.t = 0; n.dur = 0.35 + dist*0.012;
  n.stunT = rand(hz.stun[0], hz.stun[1]) + (wiped ? 0.4 : 0);
  const L = layout();
  floaters.push({x: (n.px ?? 0), y: L.yToPx(n.y)-34, text: hz.label, age:0, life:1.4});
  if (wiped && n.from > 15){
    floaters.push({x: (n.px ?? 0), y: L.yToPx(n.y)-56, text: "…all the way down!", age:0, life:1.7});
  }
}

/* ---------------- update ---------------- */
function update(dt){
  const L = layout();
  ninjas.forEach((n,i) => { n.px = laneX(i, ninjas.length, L); });

  if (phase === "announce"){
    announceT -= dt;
    if (announceT <= 0){
      banner.classList.add("hidden");
      phase = "racing";
      hazTimer = rand(1.0, 1.8);
      megaTimer = rand(4, 8);
      powerTimer = rand(5, 9);
      fiaTimer = Math.random() < 0.5 ? rand(6, 16) : -1;
      updateHUD();
    }
  }

  if (winner && (phase === "winning" || phase === "winner")){
    winner.vaultT = Math.min(1.2, (winner.vaultT || 0) + dt);
  }

  if (phase === "racing"){
    for (const n of ninjas){
      if (n.boostT > 0) n.boostT -= dt;
      switch(n.state){
        case "wait":
          n.timer -= dt * (n.boostT > 0 ? 2.2 : 1);
          if (n.timer <= 0){
            n.gain = rand(6, 13) * (n.boostT > 0 ? 1.5 : 1);
            n.state = "hook"; n.t = 0; n.dur = 0.30;
          }
          break;
        case "hook":
          n.t += dt;
          if (n.t >= n.dur){
            const target = Math.min(GOAL, n.y + n.gain);
            if (inHole(target, n.px, L)){
              floaters.push({x:(n.px ?? 0), y: L.yToPx(n.y)-34, text:"No wall to grip!", age:0, life:1.3});
              n.state = "fall"; n.from = n.y;
              n.to = Math.max(0, n.y - rand(3, 7));
              n.t = 0; n.dur = 0.3; n.stunT = 0.35;
            } else {
              n.state = "zip"; n.from = n.y;
              n.to = target;
              n.t = 0; n.dur = 0.35 + n.gain*0.018;
            }
          }
          break;
        case "zip":
          n.t += dt;
          n.y = n.from + (n.to-n.from) * easeOut(Math.min(1, n.t/n.dur));
          if (n.t >= n.dur){
            n.y = n.to;
            if (n.y >= GOAL){
              if (n.clutch === 0 && Math.random() < 0.5){
                n.clutch = 1;
                clutchDeny(n);
              } else {
                crown(n); return;
              }
            } else {
              n.state = "wait"; n.timer = rand(.35, 1.15);
            }
          }
          break;
        case "fall":
          n.t += dt;
          n.y = n.from + (n.to-n.from) * easeIn(Math.min(1, n.t/n.dur));
          if (n.t >= n.dur){
            n.y = n.to;
            if (n.to === 0 && n.from >= 25 && !n.rescued && Math.random() < 0.15){
              n.rescued = true;
              n.state = "stun"; n.stunT = 0.45;
              anims.push({kind:"tramp", n, t:0, yw:n.y, launched:false, done:false});
              floaters.push({x:(n.px ?? 0), y: L.yToPx(n.y)-52, text:"TRAMPOLINE RESCUE!", age:0, life:1.8, save:true});
            } else {
              n.state = "stun";
            }
          }
          break;
        case "bounce":
          n.t += dt;
          n.y = n.from + (n.to-n.from) * easeOut(Math.min(1, n.t/n.dur));
          if (n.t >= n.dur){
            n.y = n.to;
            n.state = "wait"; n.timer = rand(.3, .8);
          }
          break;
        case "eaten":
          break;
        case "stun":
          n.stunT -= dt;
          if (n.stunT <= 0){ n.state = "wait"; n.timer = rand(.2,.7); }
          break;
        case "carry":
          n.y = Math.max(0, n.y - dt*15);   // slow, careful rappel
          if (n.y <= 0){
            n.y = 0;
            fia.phase = "ground"; fia.t = 0;
            fia.gx = n.px + 22;
            floaters.push({x: n.px, y: L.yToPx(0)-56, text:"Fia is safe! ♥", age:0, life:2.2, save:true});
            n.state = "wait"; n.timer = 0.9;
          }
          break;
      }
    }
    if (fiaTimer > 0){
      fiaTimer -= dt;
      if (fiaTimer <= 0){ fiaTimer = -1; dropFia(); }
    }
    updateFia(dt, L);
    hazTimer -= dt;
    if (hazTimer <= 0){ hazTimer = rand(0.9, 1.7); spawnHazard(); }
    megaTimer -= dt;
    if (megaTimer <= 0){
      megaTimer = triggerMega() ? rand(9, 15) : rand(4, 7);
    }
    powerTimer -= dt;
    if (powerTimer <= 0){ powerTimer = rand(8, 14); spawnPower(); }
  }

  if (phase === "winning"){
    winTimer -= dt;
    if (winTimer <= 0){
      phase = "winner";
      winnerName.textContent = winner.name;
      winOverlay.classList.remove("hidden");
    }
  }

  if (phase === "descending"){
    let allDown = true;
    for (const n of ninjas){
      if (n === winner){
        n.goneT += dt;
        if (n.goneT < 0.7) allDown = false;
        continue;
      }
      if (n.y > 0){ n.y = Math.max(0, n.y - dt*55); }
      if (n.y > 0) allDown = false;
    }
    if (allDown) finishDescent();
  }

  // hazard anims
  for (const a of anims){
    if (a.done) continue;
    if (a.kind === "bird"){
      const ty = L.yToPx(a.n.y) - 12;
      a.flap += dt*20;
      a.x += a.dir * a.speed * dt;
      a.y = ty + Math.sin(a.flap*0.4)*4;
      const tx = a.n.px;
      if ((a.dir===1 && a.x >= tx) || (a.dir===-1 && a.x <= tx)){
        a.done = true; applyHazard(a.n, a.hz);
      }
      if (a.x < -60 || a.x > L.w+60) a.done = true;
    } else if (a.kind === "dropper"){
      const ty = L.yToPx(a.n.y) - 12;
      a.y += a.vy*dt; a.vy += 300*dt;
      if (a.y >= ty){ a.done = true; applyHazard(a.n, a.hz); }
      if (a.y > L.h) a.done = true;
    } else if (a.kind === "cheese"){
      if (a.delay > 0){ a.delay -= dt; continue; }
      a.y += a.vy*dt; a.vy += 320*dt; a.spin += dt*4;
      if (a.n){
        const ty = L.yToPx(a.n.y) - 12;
        if (a.y >= ty){ a.done = true; applyHazard(a.n, a.hz); }
      }
      if (a.y > L.h - L.botPad + 24) a.done = true;
    } else if (a.kind === "flock"){
      a.x += a.dir * a.speed * dt;
      a.flap += dt*16;
      for (const n of ninjas){
        if (a.hit.has(n)) continue;
        if (n.state === "top" || n.state === "eaten" || n.state === "freeze" || n.state === "descend") continue;
        if (Math.abs(n.y - a.yWorld) < 9 && Math.abs((n.px ?? -999) - a.x) < 28){
          a.hit.add(n); applyHazard(n, a.hz);
        }
      }
      if (a.x < -160 || a.x > L.w+160) a.done = true;
    } else if (a.kind === "trex"){
      a.t += dt;
      if (!a.chomped) a.yw = a.n.y; // track victim until the bite
      const fromX = a.side === -1 ? -220 : L.w + 220;
      const toX = a.n.px;
      if (a.t < 0.7){
        a.x = fromX + (toX - fromX) * easeOut(a.t/0.7);
      } else {
        if (!a.chomped){
          a.chomped = true;
          if (phase === "racing" && a.n.state !== "top" && a.n.state !== "freeze"){
            a.n.state = "eaten";
            floaters.push({x: a.n.px, y: L.yToPx(a.yw)-40, text:"CHOMP!", age:0, life:1.2});
          }
        }
        a.x = toX + (fromX - toX) * easeIn(Math.min(1, (a.t-0.7)/0.9));
      }
      if (a.t >= 1.7){
        a.done = true;
        if (a.n.state === "eaten"){
          a.n.y = 0; a.n.state = "stun"; a.n.stunT = 1.3;
          floaters.push({x: a.n.px, y: L.yToPx(0)-40, text:"...spat out at the bottom!", age:0, life:1.8});
        }
      }
    } else if (a.kind === "shark"){
      a.t += dt;
      const p = Math.min(1, a.t/a.dur);
      a.p = p;
      a.x = a.x0 + (a.x1 - a.x0)*p;
      const groundY = L.h - L.botPad + 44;
      const apexY = L.topPad + (L.h - L.topPad - L.botPad) * (1 - a.apex);
      a.y = groundY - Math.sin(p*Math.PI) * (groundY - apexY);
      // water droplet trail
      if (!reduceMotion && Math.random() < dt*24){
        particles.push({x: a.x - a.dir*70, y: a.y + rand(-10,16),
          vx: rand(-40,40), vy: rand(-50,20), life: rand(.5,.9), age:0,
          size: rand(1.5,3), color:"#bcd8f0", spin:0});
      }
      // takedowns
      for (const n of a.targets){
        if (a.hit.has(n)) continue;
        if (n.state==="top"||n.state==="freeze"||n.state==="descend"||n.state==="eaten"){ a.hit.add(n); continue; }
        if (Math.abs((n.px ?? -9999) - a.x) < 36){
          a.hit.add(n);
          applyHazard(n, a.hz);
        }
      }
      if (p >= 1) a.done = true;
    } else if (a.kind === "godzilla"){
      a.t += dt;
      if (!a.fired && a.t >= 1.0){
        a.fired = true;
        shakeT = 0.4;
        const fw = rand(0.5, 0.7);
        const fx = Math.max(0, 1 - fw - rand(0, 0.15));
        a.zone = {fx, fw};
        destroyWall(fx, fw, a.yBand, rand(7, 10));
        kaijuStrike(a.yBand, 9, fx, fw,
          {label:"Atomic breath!", drop:[20,30], stun:[1,1.6], wipeout:1});
      }
      if (a.t >= a.dur) a.done = true;
    } else if (a.kind === "kong"){
      a.t += dt;
      if (!a.punched && a.t >= 0.9){
        a.punched = true;
        shakeT = 0.45;
        const fw = rand(0.3, 0.45);
        const fx = rand(0, 0.25);
        a.zone = {fx, fw};
        destroyWall(fx, fw, a.yBand, rand(6, 9));
        kaijuStrike(a.yBand, 8, fx, fw,
          {label:"KONG SMASH!", drop:[15,25], stun:[.8,1.4], wipeout:.6});
      }
      if (a.t >= a.dur) a.done = true;
    } else if (a.kind === "power"){
      a.y += a.vy*dt;
      a.x += (((a.n.px ?? a.x)) - a.x) * Math.min(1, dt*2.5);
      const st = a.n.state;
      const ty = L.yToPx(a.n.y) - 12;
      if (st!=="eaten" && st!=="top" && st!=="freeze" && st!=="descend" && a.y >= ty){
        a.done = true;
        if (phase === "racing"){
          if (a.ptype === "speed"){
            a.n.boostT = 6;
            floaters.push({x:a.n.px, y:ty-28, text:"⚡ SPEED BOOST!", age:0, life:1.6, save:true});
          } else {
            a.n.rocket = true;
            floaters.push({x:a.n.px, y:ty-28, text:"🚀 ROCKET PACK!", age:0, life:1.6, save:true});
          }
        }
      }
      if (a.y > L.h) a.done = true;
    } else if (a.kind === "flame"){
      a.t += dt;
      if (a.t > 0.5) a.done = true;
    } else if (a.kind === "climb"){
      a.t += dt;
      const p = Math.min(1, a.t/a.dur);
      a.yw = 112 - 118 * easeIn(p);
      for (const n of ninjas){
        if (a.hit.has(n)) continue;
        if (n.state==="top"||n.state==="freeze"||n.state==="descend"||n.state==="eaten"){ a.hit.add(n); continue; }
        if (a.yw <= n.y + 4){
          a.hit.add(n);
          applyHazard(n, a.hz);
        }
      }
      if (p >= 1) a.done = true;
    } else if (a.kind === "ufo"){
      a.t += dt;
      const n = a.n;
      if (a.t > 1.0 && !a.announced){
        a.announced = true;
        floaters.push({x: L.w/2, y: L.topPad + 74, text:"YOU HAVE BEEN SELECTED", age:0, life:3.0, big:true});
      }
      if (a.t > 1.0){
        const bp = Math.min(1, (a.t - 1.0)/1.9);
        n.y = a.beamFromY + (GOAL - a.beamFromY) * easeOut(bp);
        n.abductSpin = bp * 6.5;
      }
      if (a.t >= 3.2 && !a.crowned){
        a.crowned = true;
        n.ufoWin = true;
        crown(n);
      }
      if (a.t >= 4.0) a.done = true;
    } else if (a.kind === "tramp"){
      a.t += dt;
      if (!a.launched && a.t >= 0.4){
        a.launched = true;
        const n = a.n;
        if (phase === "racing" && n.state !== "top" && n.state !== "eaten" && n.state !== "freeze"){
          n.state = "bounce";
          n.from = n.y;
          n.to = rand(35, 50); // never higher than halfway
          n.t = 0; n.dur = 0.7;
        }
      }
      if (a.t > 1.5) a.done = true;
    }
  }
  anims = anims.filter(a => !a.done);

  // destroyed wall slowly rebuilds
  for (const hZ of wallHoles){
    hZ.age += dt;
    hZ.r = Math.max(0, hZ.r0 * (1 - hZ.age / hZ.rebuildT));
  }
  wallHoles = wallHoles.filter(hZ => hZ.r > 0.5);
  if (shakeT > 0) shakeT -= dt;

  // floaters
  for (const f of floaters){ f.age += dt; f.y -= 22*dt; }
  floaters = floaters.filter(f => f.age < f.life);

  // particles
  for (const p of particles){
    p.age += dt; p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 120*dt; p.spin += dt*3;
  }
  particles = particles.filter(p => p.age < p.life);

  // ambient
  if (!reduceMotion && Math.random() < dt*3){
    const kind = theme().particles;
    if (kind === "snow" || kind === "sakura" || kind === "ember"){
      particles.push({x: rand(0,L.w), y: -10, vx: rand(-20,20), vy: rand(28,60),
        life: rand(4,8), age:0, size: kind==="snow"?rand(1.5,3):rand(3,5),
        color: theme().particleColor, spin: rand(0,6.28), ambient:true});
    }
  }
}

/* ---------------- drawing ---------------- */
function draw(){
  const L = layout();
  const th = theme();
  const {w,h} = L;

  ctx.save();
  if (shakeT > 0 && !reduceMotion){
    const m = shakeT * 16;
    ctx.translate(rand(-m,m), rand(-m,m));
  }

  // sky
  const g = ctx.createLinearGradient(0,0,0,h);
  g.addColorStop(0, th.skyTop); g.addColorStop(1, th.skyBot);
  ctx.fillStyle = g; ctx.fillRect(-24,-24,w+48,h+48);
  drawBackdrop(L, th);

  // wall
  ctx.fillStyle = th.wall;
  ctx.fillRect(L.wallL, L.topPad-10, L.wallR-L.wallL, h - L.topPad + 10);
  drawWallPattern(L, th);
  drawWallHoles(L);

  // top ledge / goal
  drawLedge(L, th);

  // ground
  ctx.fillStyle = "rgba(0,0,0,.28)";
  ctx.fillRect(0, h-L.botPad+34, w, L.botPad);
  ctx.fillStyle = "rgba(255,255,255,.06)";
  ctx.fillRect(L.wallL-14, h-L.botPad+30, (L.wallR-L.wallL)+28, 6);

  if (th.deco === "kaiju") drawKaijuIdle(L);

  // ninjas
  ninjas.forEach((n,i) => drawNinja(n, L));
  drawFia(L);

  // hazard anims
  for (const a of anims) drawHazard(a, th, L);

  // floaters
  for (const f of floaters){
    const alpha = 1 - f.age/f.life;
    const save = f.save;
    ctx.font = f.big ? "900 24px system-ui, sans-serif" : "800 13px system-ui, sans-serif";
    const tw = ctx.measureText(f.text).width;
    const bh = f.big ? 34 : 20;
    const x = Math.min(Math.max(f.x, tw/2+8), L.w - tw/2 - 8);
    ctx.fillStyle = `rgba(10,12,24,${alpha*.85})`;
    roundRect(x - tw/2 - 9, f.y - bh + 6, tw + 18, bh, 9); ctx.fill();
    ctx.fillStyle = f.big ? `rgba(255,215,106,${alpha})`
                  : save ? `rgba(120,230,150,${alpha})`
                  : `rgba(255,120,120,${alpha})`;
    ctx.textAlign = "center";
    ctx.fillText(f.text, x, f.y);
  }

  // particles
  for (const p of particles){
    const alpha = p.ambient ? 0.7 : Math.max(0, 1 - p.age/p.life);
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.spin);
    ctx.fillStyle = p.color; ctx.globalAlpha = alpha;
    if (theme().particles === "snow" && p.ambient){
      ctx.beginPath(); ctx.arc(0,0,p.size,0,6.28); ctx.fill();
    } else {
      ctx.beginPath(); ctx.ellipse(0,0,p.size, p.size*0.6, 0, 0, 6.28); ctx.fill();
    }
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawWallHoles(L){
  const W = L.wallR - L.wallL;
  const span = L.h - L.topPad - L.botPad;
  for (const hZ of wallHoles){
    const cx = L.wallL + (hZ.fx + hZ.fw/2)*W;
    const rebuild = 1 - hZ.r/hZ.r0;
    const rx = (hZ.fw/2)*W * (hZ.r/hZ.r0);
    const cy = L.yToPx(hZ.y);
    const ry = (hZ.r/GOAL)*span;
    if (ry < 2 || rx < 4) continue;
    ctx.save();
    ctx.beginPath(); ctx.rect(L.wallL, L.topPad-10, W, L.h-L.topPad+10); ctx.clip();
    // jagged hole through the wall
    ctx.fillStyle = "#111219";
    ctx.beginPath();
    const N = hZ.jit.length;
    for (let i=0;i<N;i++){
      const ang = (i/N)*Math.PI*2;
      const px = cx + Math.cos(ang)*rx*hZ.jit[i];
      const py = cy + Math.sin(ang)*ry*hZ.jit[(i+5)%N];
      if (i===0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath(); ctx.fill();
    // hot cracked edge
    ctx.strokeStyle = "rgba(240,146,90,.45)";
    ctx.lineWidth = 2;
    ctx.stroke();
    // rebuild scaffolding grows as the hole shrinks
    if (rebuild > 0.12){
      ctx.strokeStyle = `rgba(232,182,76,${0.2 + rebuild*0.35})`;
      ctx.lineWidth = 1.5;
      for (let yy = cy - ry; yy <= cy + ry; yy += 9){
        ctx.beginPath(); ctx.moveTo(cx - rx, yy); ctx.lineTo(cx + rx, yy); ctx.stroke();
      }
    }
    ctx.restore();
  }
}

function drawGodzillaBody(bob){
  ctx.save();
  ctx.translate(0, bob);
  ctx.fillStyle = "#2e3d2e";
  // tail sweeping back
  ctx.beginPath();
  ctx.moveTo(-40, -20); ctx.quadraticCurveTo(-120, -10, -152, -48);
  ctx.quadraticCurveTo(-110, 4, -36, 0);
  ctx.closePath(); ctx.fill();
  // legs
  roundRect(-38, -56, 26, 58, 8); ctx.fill();
  roundRect(-4, -56, 26, 58, 8); ctx.fill();
  // body
  ctx.beginPath(); ctx.ellipse(-8, -104, 44, 62, 0.1, 0, 6.28); ctx.fill();
  // arm
  roundRect(18, -122, 16, 42, 7); ctx.fill();
  // head + snout
  ctx.beginPath(); ctx.ellipse(28, -170, 26, 20, 0.15, 0, 6.28); ctx.fill();
  roundRect(40, -172, 26, 14, 6); ctx.fill();
  // dorsal spines
  ctx.fillStyle = "#c8e8f0";
  const spines = [[-46,-146],[-30,-164],[-14,-176],[2,-182]];
  for (const [sx, sy] of spines){
    ctx.beginPath();
    ctx.moveTo(sx-9, sy+16); ctx.lineTo(sx, sy); ctx.lineTo(sx+9, sy+16);
    ctx.closePath(); ctx.fill();
  }
  // eye
  ctx.fillStyle = "#f0c040";
  ctx.beginPath(); ctx.arc(34, -174, 3, 0, 6.28); ctx.fill();
  ctx.restore();
}

function drawKaijuIdle(L){
  const t = performance.now()/1000;
  const gy = L.h - L.botPad + 38;
  // Godzilla stalks from the right, facing the wall
  ctx.save();
  ctx.translate(L.w - 6, gy);
  ctx.scale(-0.55, 0.55);
  drawGodzillaBody(Math.sin(t*1.4)*4);
  ctx.restore();
  // Kong squares up from the left
  ctx.save();
  ctx.translate(6, gy);
  ctx.scale(0.55, 0.55);
  drawKongBody(Math.sin(t*1.7 + 1)*4);
  ctx.restore();
}

function drawBackdrop(L, th){
  const {w,h} = L;
  const img = bgImages[themeKey];
  if (img && img.complete && img.naturalWidth){
    const s = Math.max(w/img.naturalWidth, h/img.naturalHeight);
    const iw = img.naturalWidth*s, ih = img.naturalHeight*s;
    ctx.drawImage(img, (w-iw)/2, (h-ih)/2, iw, ih);
    const tint = BG_TINT[themeKey] || [0.45, 0.7];
    const og = ctx.createLinearGradient(0,0,0,h);
    og.addColorStop(0, `rgba(10,12,26,${tint[0]})`);
    og.addColorStop(1, `rgba(10,12,26,${tint[1]})`);
    ctx.fillStyle = og; ctx.fillRect(0,0,w,h);
    return;
  }
  ctx.save();
  if (th.deco === "castle"){
    // moon + stars
    ctx.fillStyle = "#f2e9c9";
    ctx.beginPath(); ctx.arc(w*0.85, 64, 26, 0, 6.28); ctx.fill();
    ctx.fillStyle = th.skyTop;
    ctx.beginPath(); ctx.arc(w*0.85+10, 58, 22, 0, 6.28); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.7)";
    for (let i=0;i<24;i++){
      const sx = (i*97)%w, sy = (i*57)%Math.max(1,(h*0.5));
      ctx.fillRect(sx, sy, 2, 2);
    }
  } else if (th.deco === "neon"){
    // distant skyline glow
    ctx.fillStyle = "rgba(58,224,200,.10)";
    for (let i=0;i<6;i++){
      const bw = 40+((i*53)%70), bx = ((i*160)+30)%Math.max(1,w-bw);
      ctx.fillRect(bx, h*0.35+((i*37)%80), bw, h);
    }
    ctx.fillStyle = "rgba(224,90,180,.12)";
    for (let i=0;i<5;i++){
      const bw = 30+((i*71)%60), bx = ((i*210)+90)%Math.max(1,w-bw);
      ctx.fillRect(bx, h*0.45+((i*53)%70), bw, h);
    }
  } else if (th.deco === "frost"){
    // far peaks
    ctx.fillStyle = "rgba(255,255,255,.10)";
    ctx.beginPath();
    ctx.moveTo(0, h*0.6);
    ctx.lineTo(w*0.2, h*0.28); ctx.lineTo(w*0.4, h*0.55);
    ctx.lineTo(w*0.65, h*0.22); ctx.lineTo(w*0.9, h*0.5);
    ctx.lineTo(w, h*0.4); ctx.lineTo(w, h); ctx.lineTo(0, h);
    ctx.closePath(); ctx.fill();
  } else if (th.deco === "kaiju"){
    // ruined skyline + smoke plumes
    ctx.fillStyle = "rgba(0,0,0,.35)";
    for (let i=0;i<7;i++){
      const bw = 34+((i*61)%64), bx = ((i*150)+20)%Math.max(1, w-bw);
      const bh = h*0.3 + ((i*47)%120);
      ctx.fillRect(bx, h-bh, bw, bh);
      // jagged broken top
      ctx.beginPath();
      ctx.moveTo(bx, h-bh); ctx.lineTo(bx+bw*0.3, h-bh-14);
      ctx.lineTo(bx+bw*0.6, h-bh); ctx.lineTo(bx+bw, h-bh-8);
      ctx.lineTo(bx+bw, h-bh+10); ctx.lineTo(bx, h-bh+10);
      ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = "rgba(240,146,90,.12)";
    for (let i=0;i<4;i++){
      const sx = ((i*230)+80)%Math.max(1,w);
      ctx.beginPath(); ctx.ellipse(sx, h*0.45+((i*67)%90), 34, 60, 0.3, 0, 6.28); ctx.fill();
    }
  }
  ctx.restore();
}

function drawWallPattern(L, th){
  const {wallL, wallR, topPad, h} = L;
  ctx.save();
  ctx.beginPath(); ctx.rect(wallL, topPad-10, wallR-wallL, h-topPad+10); ctx.clip();
  ctx.strokeStyle = th.wallLine; ctx.lineWidth = 2;
  const rowH = 26;
  for (let y = topPad; y < h; y += rowH){
    ctx.beginPath(); ctx.moveTo(wallL, y); ctx.lineTo(wallR, y); ctx.stroke();
    const off = ((y/rowH)|0)%2 ? 30 : 0;
    for (let x = wallL+off; x < wallR; x += 60){
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y+rowH); ctx.stroke();
    }
  }
  if (th.deco === "neon"){
    // window glows
    ctx.fillStyle = "rgba(58,224,200,.14)";
    for (let i=0;i<10;i++){
      const x = wallL + ((i*137)% (wallR-wallL-40)) + 10;
      const y = topPad + ((i*211)%(h-topPad-80)) + 20;
      ctx.fillRect(x, y, 26, 16);
    }
  }
  if (th.deco === "frost"){
    ctx.fillStyle = "rgba(255,255,255,.14)";
    for (let i=0;i<12;i++){
      const x = wallL + ((i*97)%(wallR-wallL-30));
      const y = topPad + ((i*173)%(h-topPad-60));
      ctx.beginPath(); ctx.arc(x, y, 8+(i%3)*3, 0, 6.28); ctx.fill();
    }
  }
  ctx.restore();
}

function drawLedge(L, th){
  const {wallL, wallR, topPad, w} = L;
  const y = topPad - 10;
  // roof / ledge
  ctx.fillStyle = th.ledge2;
  ctx.fillRect(wallL-18, y-8, (wallR-wallL)+36, 14);
  ctx.fillStyle = th.ledge;
  ctx.beginPath();
  ctx.moveTo(wallL-26, y-8);
  ctx.lineTo(wallL + (wallR-wallL)/2, y-34);
  ctx.lineTo(wallR+26, y-8);
  ctx.closePath(); ctx.fill();
  // flag
  const fx = wallL + (wallR-wallL)/2;
  ctx.strokeStyle = "#e8e8f0"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(fx, y-34); ctx.lineTo(fx, y-62); ctx.stroke();
  ctx.fillStyle = "#e8b64c";
  ctx.beginPath(); ctx.moveTo(fx, y-62); ctx.lineTo(fx+26, y-55); ctx.lineTo(fx, y-48);
  ctx.closePath(); ctx.fill();
  ctx.font = "800 11px system-ui, sans-serif";
  ctx.fillStyle = "rgba(255,255,255,.75)";
  ctx.textAlign = "center";
  ctx.fillText("SHARE ZONE", fx, y - 16);
}

function drawBaby(x, y, t, mode){
  ctx.save();
  ctx.translate(x, y);
  if (mode === "falling") ctx.rotate(Math.sin(t*6)*0.35);
  // onesie
  ctx.fillStyle = "#f4a7c4";
  roundRect(-6, -4, 12, 12, 5); ctx.fill();
  // arms
  ctx.strokeStyle = "#f4a7c4"; ctx.lineWidth = 3.5; ctx.lineCap = "round";
  const wave = mode === "falling" ? Math.sin(t*14)*3 : 0;
  ctx.beginPath(); ctx.moveTo(-5, -1); ctx.lineTo(-10, mode==="falling" ? -9+wave : 3); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(5, -1); ctx.lineTo(10, mode==="falling" ? -9-wave : 3); ctx.stroke();
  // head
  ctx.fillStyle = "#f2c9a0";
  ctx.beginPath(); ctx.arc(0, -10, 7, 0, 6.28); ctx.fill();
  // hair tuft + bow
  ctx.strokeStyle = "#5a3a22"; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.arc(1, -18, 3, Math.PI*0.9, Math.PI*1.9); ctx.stroke();
  ctx.fillStyle = "#e0507e";
  ctx.beginPath(); ctx.moveTo(4,-16); ctx.lineTo(9,-19); ctx.lineTo(9,-13); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(4,-16); ctx.lineTo(-1,-19); ctx.lineTo(-1,-13); ctx.closePath(); ctx.fill();
  // face
  ctx.fillStyle = "#2a1c14";
  if (mode === "falling"){
    ctx.beginPath(); ctx.arc(-2.5, -11, 1.1, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(2.5, -11, 1.1, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -7, 1.6, 0, 6.28); ctx.fill();   // "o" mouth
  } else {
    ctx.lineWidth = 1.2; ctx.strokeStyle = "#2a1c14";
    ctx.beginPath(); ctx.arc(-2.5, -11, 1.3, Math.PI*1.1, Math.PI*1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(2.5, -11, 1.3, Math.PI*1.1, Math.PI*1.9); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, -8, 2.2, 0.15*Math.PI, 0.85*Math.PI); ctx.stroke(); // smile
  }
  ctx.fillStyle = "rgba(240,120,140,.45)";
  ctx.beginPath(); ctx.arc(-4.5, -8.5, 1.5, 0, 6.28); ctx.fill();
  ctx.beginPath(); ctx.arc(4.5, -8.5, 1.5, 0, 6.28); ctx.fill();
  ctx.restore();
  // name tag
  ctx.font = "800 10px system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(10,12,24,.72)";
  roundRect(x - 13, y - 40, 26, 14, 6); ctx.fill();
  ctx.fillStyle = "#f4a7c4";
  ctx.fillText("Fia", x, y - 29.5);
}

function drawFia(L){
  if (!fia) return;
  if (fia.phase === "falling"){
    drawBaby(fia.x, fia.y, fia.t, "falling");
  } else if (fia.phase === "carried"){
    const n = fia.n;
    drawBaby(n.px + 24, L.yToPx(n.y) - 4, fia.t, "held");
  } else {
    const gy = L.yToPx(0) + 2;
    drawBaby(fia.gx, gy, fia.t, "ground");
    // little floating heart for a moment after landing
    if (fia.t < 2.5){
      const a = 1 - fia.t/2.5;
      ctx.fillStyle = `rgba(240,90,130,${a})`;
      ctx.font = "16px system-ui";
      ctx.textAlign = "center";
      ctx.fillText("♥", fia.gx + 12, gy - 40 - fia.t*14);
    }
  }
}

function drawNinja(n, L){
  if (n.state === "eaten") return;
  if (n.ufoWin && (n.state === "top" || n.state === "gone")) return; // already aboard
  if (n.state === "beamed"){
    const x = n.px, y = L.yToPx(n.y);
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(n.abductSpin || 0);
    ctx.scale(0.95, 0.95);
    ctx.fillStyle = "#23252e";
    roundRect(-7, -14, 14, 16, 5); ctx.fill();
    ctx.beginPath(); ctx.arc(0, -19, 7.5, 0, 6.28); ctx.fill();
    ctx.fillStyle = n.color;
    ctx.fillRect(-7.5, -22.5, 15, 4);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(-4.5, -20, 3, 2); ctx.fillRect(1.5, -20, 3, 2);
    ctx.fillStyle = "#23252e";
    ctx.fillRect(-6, 1, 4, 5); ctx.fillRect(2, 1, 4, 5);
    ctx.restore();
    ctx.font = "800 11px system-ui, sans-serif";
    const tw = ctx.measureText(n.name).width;
    ctx.fillStyle = "rgba(10,12,24,.72)";
    roundRect(x - tw/2 - 6, y - 46, tw + 12, 16, 7); ctx.fill();
    ctx.fillStyle = "#8cf0c8";
    ctx.textAlign = "center";
    ctx.fillText(n.name, x, y - 34);
    return;
  }
  let x = n.px, y = L.yToPx(n.y);
  let alpha = 1;
  if (n === winner && (n.state === "top" || n.state === "gone")){
    const peakX = L.wallL + (L.wallR - L.wallL)/2;
    const peakY = L.topPad - 40;
    const p = Math.min(1, (n.vaultT || 0)/0.9);
    const e = easeOut(p);
    const hop = Math.sin(p * Math.PI) * 30;
    const startY = L.yToPx(GOAL);
    x = n.px + (peakX - n.px)*e;
    y = startY + (peakY - startY)*e - hop;
    if (n.state === "gone"){
      alpha = Math.max(0, 1 - n.goneT/0.6);
      y += n.goneT * 20; // stepping down behind the roof
    }
    if (alpha <= 0) return;
  }
  ctx.globalAlpha = alpha;

  // grappling rope + hook
  if (n.state === "hook" || n.state === "zip"){
    const targetY = L.yToPx(n.state === "hook" ? Math.min(GOAL, n.y + n.gain) : n.to);
    const prog = n.state === "hook" ? easeOut(Math.min(1, n.t/n.dur)) : 1;
    const hy = y + (targetY - y)*prog - 6;
    ctx.strokeStyle = "rgba(230,230,240,.8)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x, y-14); ctx.lineTo(x, hy); ctx.stroke();
    // hook
    ctx.strokeStyle = "#c8c8d8"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, hy, 5, Math.PI*0.15, Math.PI*0.85, true); ctx.stroke();
  }
  if (n.state === "descend" || n.state === "carry"){
    ctx.strokeStyle = "rgba(230,230,240,.5)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(x, L.topPad-10); ctx.lineTo(x, y-14); ctx.stroke();
  }

  const stunned = n.state === "stun";
  const wob = (n.state === "wait") ? Math.sin((performance.now()/300)+n.wobble)*1.5 : 0;

  ctx.save();
  ctx.translate(x, y + wob);
  if (n.state === "fall") ctx.rotate(Math.sin(n.t*20)*0.15);

  // scarf tail
  ctx.strokeStyle = n.color; ctx.lineWidth = 4; ctx.lineCap = "round";
  const flow = (n.state==="zip") ? 10 : 5;
  ctx.beginPath(); ctx.moveTo(3, -16);
  ctx.quadraticCurveTo(10, -14+flow*0.3, 8+flow, -10+flow*0.6); ctx.stroke();

  // body
  ctx.fillStyle = "#23252e";
  roundRect(-7, -14, 14, 16, 5); ctx.fill();
  // head
  ctx.beginPath(); ctx.arc(0, -19, 7.5, 0, 6.28); ctx.fill();
  // headband
  ctx.fillStyle = n.color;
  ctx.fillRect(-7.5, -22.5, 15, 4);
  // eyes
  ctx.fillStyle = stunned ? "#f0c040" : "#ffffff";
  if (stunned){
    ctx.font = "700 9px system-ui"; ctx.textAlign="center";
    ctx.fillText("×  ×", 0, -17.5);
  } else {
    ctx.fillRect(-4.5, -20, 3, 2); ctx.fillRect(1.5, -20, 3, 2);
  }
  // legs
  ctx.fillStyle = "#23252e";
  ctx.fillRect(-6, 1, 4, 5); ctx.fillRect(2, 1, 4, 5);

  // stun stars
  if (stunned){
    ctx.fillStyle = "#f0c040";
    const a = performance.now()/200;
    for (let i=0;i<3;i++){
      const ang = a + i*2.1;
      ctx.beginPath();
      ctx.arc(Math.cos(ang)*12, -28 + Math.sin(ang)*3, 1.6, 0, 6.28);
      ctx.fill();
    }
  }
  ctx.restore();

  // name tag
  ctx.font = "800 11px system-ui, sans-serif";
  const tw = ctx.measureText(n.name).width;
  ctx.fillStyle = "rgba(10,12,24,.72)";
  roundRect(x - tw/2 - 6, y - 46, tw + 12, 16, 7); ctx.fill();
  ctx.fillStyle = (winner === n) ? "#ffd76a" : "#eef0fa";
  ctx.textAlign = "center";
  ctx.fillText(n.name, x, y - 34);
  ctx.globalAlpha = 1;
}

function drawHazard(a, th, L){
  ctx.save();
  if (a.kind === "bird"){
    ctx.translate(a.x, a.y);
    ctx.scale(a.dir, 1);
    if (a.hz.id === "drone"){
      ctx.fillStyle = "#9aa0c3";
      roundRect(-9, -3, 18, 7, 3); ctx.fill();
      ctx.strokeStyle = "#3ae0c8"; ctx.lineWidth = 2;
      const rot = Math.sin(a.flap)*6;
      ctx.beginPath(); ctx.moveTo(-11-rot, -6); ctx.lineTo(-3+rot, -6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(3-rot, -6); ctx.lineTo(11+rot, -6); ctx.stroke();
      ctx.fillStyle = "#e05a5a"; ctx.fillRect(-3, 4, 6, 4);
    } else {
      const owl = a.hz.id === "owl";
      ctx.fillStyle = owl ? "#e8e8f0" : "#b8bccb";
      ctx.beginPath(); ctx.ellipse(0, 0, 9, 6, 0, 0, 6.28); ctx.fill();
      ctx.beginPath(); ctx.arc(8, -2, 4.5, 0, 6.28); ctx.fill();
      const wingY = Math.sin(a.flap)*8;
      ctx.beginPath(); ctx.moveTo(-2, -2);
      ctx.quadraticCurveTo(-8, -10 - wingY, -14, -4 - wingY);
      ctx.quadraticCurveTo(-8, -2, -2, 0); ctx.fill();
      ctx.fillStyle = "#f0925a";
      ctx.beginPath(); ctx.moveTo(12, -2); ctx.lineTo(16, -1); ctx.lineTo(12, 0);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#101322";
      ctx.beginPath(); ctx.arc(9, -3, 1.2, 0, 6.28); ctx.fill();
    }
  } else if (a.kind === "dropper"){
    ctx.translate(a.x, a.y);
    if (a.hz.id === "icicle"){
      ctx.fillStyle = "#d8ecff";
      ctx.beginPath(); ctx.moveTo(-4, -10); ctx.lineTo(4, -10); ctx.lineTo(0, 8);
      ctx.closePath(); ctx.fill();
    } else if (a.hz.id === "soap"){
      ctx.fillStyle = "rgba(200,240,255,.9)";
      ctx.beginPath(); ctx.arc(0, 0, 6, 0, 6.28); ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,.8)";
      ctx.beginPath(); ctx.arc(-2, -2, 2, 0, 6.28); ctx.fill();
    } else {
      ctx.fillStyle = "#6b6f85";
      ctx.beginPath();
      ctx.moveTo(-6, 2); ctx.lineTo(-3, -5); ctx.lineTo(3, -6); ctx.lineTo(6, 0);
      ctx.lineTo(3, 5); ctx.lineTo(-3, 5); ctx.closePath(); ctx.fill();
    }
  } else if (a.kind === "cheese"){
    if (a.delay > 0){ ctx.restore(); return; }
    ctx.translate(a.x, a.y);
    ctx.rotate(a.spin);
    // cheese wedge
    ctx.fillStyle = "#f5c542";
    ctx.beginPath();
    ctx.moveTo(-10, 7); ctx.lineTo(10, 7); ctx.lineTo(6, -8); ctx.lineTo(-6, -8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e0a92e";
    ctx.fillRect(-10, 5, 20, 2);
    // holes
    ctx.fillStyle = "#c98d1e";
    ctx.beginPath(); ctx.arc(-3, 0, 2.2, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(4, -3, 1.6, 0, 6.28); ctx.fill();
    ctx.beginPath(); ctx.arc(2, 3, 1.4, 0, 6.28); ctx.fill();
  } else if (a.kind === "flock"){
    const fy = L.yToPx(a.yWorld) - 12;
    const offsets = [[0,0],[-26,-12],[-26,12],[-52,-22],[-52,22],[-78,-30]];
    for (let i=0;i<offsets.length;i++){
      const [dx, dy] = offsets[i];
      const gx = a.x + dx * a.dir * -1;
      const gy = fy + dy + Math.sin(a.flap + i)*3;
      ctx.save();
      ctx.translate(gx, gy);
      ctx.scale(a.dir, 1);
      // goose body
      ctx.fillStyle = "#d8d4c8";
      ctx.beginPath(); ctx.ellipse(0, 0, 10, 6, 0, 0, 6.28); ctx.fill();
      // wing flap
      const wingY = Math.sin(a.flap*1.4 + i)*9;
      ctx.beginPath(); ctx.moveTo(-2, -2);
      ctx.quadraticCurveTo(-8, -11 - wingY, -15, -5 - wingY);
      ctx.quadraticCurveTo(-8, -2, -2, 0); ctx.fill();
      // black neck + head (canada goose)
      ctx.strokeStyle = "#1a1c22"; ctx.lineWidth = 3; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(8, -1);
      ctx.quadraticCurveTo(13, -4, 14, -9); ctx.stroke();
      ctx.fillStyle = "#1a1c22";
      ctx.beginPath(); ctx.arc(14, -10, 3.2, 0, 6.28); ctx.fill();
      // chinstrap + beak
      ctx.fillStyle = "#f0f0f0";
      ctx.beginPath(); ctx.arc(14, -8.5, 1.4, 0, 6.28); ctx.fill();
      ctx.fillStyle = "#2c2e36";
      ctx.beginPath(); ctx.moveTo(17, -10); ctx.lineTo(21, -9.5); ctx.lineTo(17, -8.6);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  } else if (a.kind === "trex"){
    const y = L.yToPx(a.yw) - 10;
    const jaw = a.chomped
      ? Math.max(0, 0.55 - (a.t - 0.7)*2.4)
      : Math.min(0.55, a.t * 0.9);
    ctx.translate(a.x, y);
    ctx.scale(a.side === -1 ? 1 : -1, 1); // face right by default
    // neck stretching back offscreen
    ctx.fillStyle = "#4f7d46";
    ctx.fillRect(-720, -18, 660, 44);
    // head
    ctx.beginPath(); ctx.ellipse(-30, -4, 44, 28, 0, 0, 6.28); ctx.fill();
    // brow ridge
    ctx.fillStyle = "#436b3b";
    ctx.beginPath(); ctx.ellipse(-38, -22, 18, 8, -0.2, 0, 6.28); ctx.fill();
    // upper jaw
    ctx.save();
    ctx.translate(-8, -8); ctx.rotate(-jaw);
    ctx.fillStyle = "#4f7d46";
    roundRect(0, -12, 52, 18, 7); ctx.fill();
    ctx.fillStyle = "#ffffff";
    for (let i=0;i<4;i++){
      ctx.beginPath();
      ctx.moveTo(10 + i*11, 6); ctx.lineTo(15 + i*11, 6); ctx.lineTo(12.5 + i*11, 13);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // lower jaw
    ctx.save();
    ctx.translate(-8, 4); ctx.rotate(jaw);
    ctx.fillStyle = "#3f6538";
    roundRect(0, -3, 46, 14, 6); ctx.fill();
    ctx.fillStyle = "#ffffff";
    for (let i=0;i<4;i++){
      ctx.beginPath();
      ctx.moveTo(9 + i*10, -2); ctx.lineTo(14 + i*10, -2); ctx.lineTo(11.5 + i*10, -8);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    // eye
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(-42, -14, 5.5, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#101322";
    ctx.beginPath(); ctx.arc(-40.5, -14, 2.4, 0, 6.28); ctx.fill();
    // nostril
    ctx.fillStyle = "#2e4a29";
    ctx.beginPath(); ctx.arc(2, -14, 2, 0, 6.28); ctx.fill();
  } else if (a.kind === "godzilla"){
    const rise = a.t < 0.7 ? easeOut(a.t/0.7)
               : (a.t > a.dur-0.6 ? Math.max(0, 1 - easeIn((a.t-(a.dur-0.6))/0.6)) : 1);
    const gy = L.h - L.botPad + 40 + (1 - rise)*300;
    // beam first, so the body overlaps its base
    if (a.zone && a.t >= 1.0 && a.t <= 1.7){
      const by = L.yToPx(a.yBand);
      const mx = L.w - 30 - 1.15*40;
      const my = gy - 1.15*170;
      const W = L.wallR - L.wallL;
      const x0 = L.wallL + a.zone.fx*W + 8;
      const flick = 1 + Math.sin(a.t*60)*0.15;
      const grad = ctx.createLinearGradient(mx, 0, x0, 0);
      grad.addColorStop(0, "rgba(170,235,255,.95)");
      grad.addColorStop(1, "rgba(90,180,255,.3)");
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(mx, my - 6*flick);
      ctx.lineTo(x0, by - 15*flick);
      ctx.lineTo(x0, by + 15*flick);
      ctx.lineTo(mx, my + 6*flick);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(210,245,255,.85)";
      ctx.beginPath(); ctx.arc(x0, by, 17*flick, 0, 6.28); ctx.fill();
    }
    ctx.save();
    ctx.translate(L.w - 10, gy);
    ctx.scale(-1.15, 1.15);
    drawGodzillaBody(0);
    ctx.restore();
  } else if (a.kind === "kong"){
    const rise = a.t < 0.6 ? easeOut(a.t/0.6)
               : (a.t > a.dur-0.5 ? Math.max(0, 1 - easeIn((a.t-(a.dur-0.5))/0.5)) : 1);
    const gy = L.h - L.botPad + 40 + (1 - rise)*280;
    // punching arm stretches to the impact point
    if (a.zone && a.t >= 0.9 && a.t <= 1.5){
      const W = L.wallR - L.wallL;
      const cx2 = L.wallL + (a.zone.fx + a.zone.fw/2)*W;
      const cy2 = L.yToPx(a.yBand);
      const ext = Math.min(1, (a.t - 0.9)/0.15);
      const ax = 10 + 1.1*40, ay = gy - 1.1*120;
      const fx2 = ax + (cx2 - ax)*ext, fy2 = ay + (cy2 - ay)*ext;
      ctx.strokeStyle = "#3a2a22"; ctx.lineWidth = 26; ctx.lineCap = "round";
      ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(fx2, fy2); ctx.stroke();
      ctx.fillStyle = "#3a2a22";
      ctx.beginPath(); ctx.arc(fx2, fy2, 21, 0, 6.28); ctx.fill();
    }
    ctx.save();
    ctx.translate(10, gy);
    ctx.scale(1.1, 1.1);
    drawKongBody(0);
    ctx.restore();
  } else if (a.kind === "power"){
    ctx.translate(a.x, a.y);
    // little parachute
    ctx.fillStyle = "rgba(232,182,76,.85)";
    ctx.beginPath(); ctx.arc(0, -18, 12, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "rgba(232,182,76,.7)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-11,-16); ctx.lineTo(0, -4); ctx.moveTo(11,-16); ctx.lineTo(0, -4); ctx.stroke();
    // bubble
    ctx.fillStyle = "rgba(255,255,255,.14)";
    ctx.beginPath(); ctx.arc(0, 5, 11, 0, 6.28); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 5, 11, 0, 6.28); ctx.stroke();
    if (a.ptype === "speed"){
      ctx.fillStyle = "#f5c542";
      ctx.beginPath();
      ctx.moveTo(2, -1); ctx.lineTo(-4, 6); ctx.lineTo(-1, 6);
      ctx.lineTo(-2, 12); ctx.lineTo(4, 4); ctx.lineTo(1, 4);
      ctx.closePath(); ctx.fill();
    } else {
      ctx.fillStyle = "#e05a5a";
      roundRect(-3, 0, 6, 10, 3); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(0, -5); ctx.lineTo(3, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#f0925a";
      ctx.beginPath(); ctx.moveTo(-2, 10); ctx.lineTo(0, 14); ctx.lineTo(2, 10); ctx.closePath(); ctx.fill();
    }
  } else if (a.kind === "flame"){
    const n2 = a.n;
    const fy = L.yToPx(n2.y) + 8;
    const flick = 1 + Math.sin(a.t*50)*0.25;
    ctx.translate(n2.px ?? 0, fy);
    ctx.fillStyle = "rgba(240,146,90,.9)";
    ctx.beginPath(); ctx.moveTo(-6, 0); ctx.lineTo(0, 16*flick); ctx.lineTo(6, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(245,197,66,.9)";
    ctx.beginPath(); ctx.moveTo(-3, 0); ctx.lineTo(0, 9*flick); ctx.lineTo(3, 0); ctx.closePath(); ctx.fill();
  } else if (a.kind === "shark"){
    const p = a.p ?? 0;
    ctx.translate(a.x, a.y);
    ctx.scale(a.dir, 1);          // face travel direction
    ctx.rotate((p - 0.5) * 1.5);  // nose up on the way up, nose down on the way down
    // tail fin
    ctx.fillStyle = "#8a97ab";
    ctx.beginPath();
    ctx.moveTo(-72, -4); ctx.lineTo(-106, -32); ctx.lineTo(-92, 0);
    ctx.lineTo(-106, 28); ctx.lineTo(-72, 6);
    ctx.closePath(); ctx.fill();
    // body
    ctx.beginPath(); ctx.ellipse(0, 0, 80, 28, 0, 0, 6.28); ctx.fill();
    // white belly
    ctx.fillStyle = "#e8edf2";
    ctx.beginPath(); ctx.ellipse(-2, 11, 68, 15, 0, 0, 6.28); ctx.fill();
    // dorsal fin
    ctx.fillStyle = "#8a97ab";
    ctx.beginPath();
    ctx.moveTo(-16, -24); ctx.lineTo(0, -54); ctx.lineTo(14, -24);
    ctx.closePath(); ctx.fill();
    // pectoral fin
    ctx.beginPath();
    ctx.moveTo(4, 16); ctx.lineTo(-16, 42); ctx.lineTo(-22, 18);
    ctx.closePath(); ctx.fill();
    // open mouth
    ctx.fillStyle = "#6e1f2a";
    ctx.beginPath();
    ctx.moveTo(44, 2); ctx.lineTo(84, -14); ctx.lineTo(84, 18);
    ctx.closePath(); ctx.fill();
    // teeth
    ctx.fillStyle = "#ffffff";
    for (let i=0;i<4;i++){
      // upper row
      ctx.beginPath();
      ctx.moveTo(52 + i*8, 0 - i*3); ctx.lineTo(58 + i*8, -1.5 - i*3);
      ctx.lineTo(55 + i*8, 5 - i*3);
      ctx.closePath(); ctx.fill();
      // lower row
      ctx.beginPath();
      ctx.moveTo(52 + i*8, 8 + i*2); ctx.lineTo(58 + i*8, 9 + i*2);
      ctx.lineTo(55 + i*8, 3 + i*2);
      ctx.closePath(); ctx.fill();
    }
    // eye
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.arc(42, -14, 4.5, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#101322";
    ctx.beginPath(); ctx.arc(43, -14, 2.2, 0, 6.28); ctx.fill();
    // gills
    ctx.strokeStyle = "#6d7a8e"; ctx.lineWidth = 2;
    for (let i=0;i<3;i++){
      ctx.beginPath();
      ctx.arc(18 + i*8, -2, 12, Math.PI*0.35, Math.PI*0.65);
      ctx.stroke();
    }
  } else if (a.kind === "climb"){
    const cx = L.wallL + (L.wallR - L.wallL)/2;
    const cy = L.yToPx(a.yw);
    const pw = Math.min(340, (L.wallR - L.wallL) + 60);
    const beat = 1 + Math.sin(a.t*9)*0.03;
    ctx.translate(cx, cy);
    ctx.scale(beat, beat);
    // glow halo
    const glow = ctx.createRadialGradient(0, 0, 10, 0, 0, pw*0.72);
    glow.addColorStop(0, "rgba(255,215,120,.55)");
    glow.addColorStop(1, "rgba(255,215,120,0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.ellipse(0, 0, pw*0.72, 96, 0, 0, 6.28); ctx.fill();
    // plaque
    ctx.fillStyle = "rgba(18,14,30,.92)";
    roundRect(-pw/2, -46, pw, 92, 16); ctx.fill();
    ctx.strokeStyle = "#ffd76a"; ctx.lineWidth = 3;
    roundRect(-pw/2, -46, pw, 92, 16); ctx.stroke();
    // radiating power-ballad beams
    ctx.save();
    ctx.globalAlpha = 0.28;
    ctx.strokeStyle = "#ffd76a"; ctx.lineWidth = 2;
    for (let i=0;i<10;i++){
      const ang = a.t*1.2 + i*0.628;
      ctx.beginPath();
      ctx.moveTo(Math.cos(ang)*(pw*0.5+8), Math.sin(ang)*56);
      ctx.lineTo(Math.cos(ang)*(pw*0.5+34), Math.sin(ang)*82);
      ctx.stroke();
    }
    ctx.restore();
    // microphone
    ctx.save();
    ctx.translate(-pw/2 + 44, 2);
    ctx.rotate(-0.35);
    ctx.strokeStyle = "#c8ccdd"; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, 6); ctx.lineTo(0, 30); ctx.stroke();
    ctx.fillStyle = "#8a90ab";
    ctx.beginPath(); ctx.ellipse(0, -6, 11, 15, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#5c6178";
    for (let i=-2;i<=2;i++){
      ctx.beginPath(); ctx.ellipse(i*4, -6, 1.2, 12, 0, 0, 6.28); ctx.fill();
    }
    ctx.restore();
    // singing waveform
    ctx.strokeStyle = "#ffd76a"; ctx.lineWidth = 3; ctx.lineCap = "round";
    for (let i=0;i<9;i++){
      const bx = -pw/2 + 96 + i*14;
      const bh = 8 + Math.abs(Math.sin(a.t*7 + i*0.8)) * 22;
      ctx.beginPath(); ctx.moveTo(bx, -bh/2); ctx.lineTo(bx, bh/2); ctx.stroke();
    }
    // title
    ctx.font = "900 22px system-ui, sans-serif";
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffd76a";
    ctx.fillText("IT'S THE CLIMB", 34, 8);
    ctx.font = "800 11px system-ui, sans-serif";
    ctx.fillStyle = "rgba(255,255,255,.65)";
    ctx.fillText("♪ everybody back to the bottom ♪", 34, 26);
  } else if (a.kind === "ufo"){
    const n = a.n;
    const shipX = n.px;
    const descP = Math.min(1, a.t/1.0);
    const shipY = -60 + (L.topPad + 34 + 60) * easeOut(descP);
    const bob = Math.sin(a.t*3)*4;
    const beamOn = a.t > 1.0 && a.t < 3.4;
    // tractor beam
    if (beamOn){
      const fade = Math.min(1, (a.t-1.0)/0.25) * Math.min(1, (3.4-a.t)/0.4);
      const groundY = L.yToPx(0) + 10;
      const bg = ctx.createLinearGradient(0, shipY, 0, groundY);
      bg.addColorStop(0, `rgba(140,240,200,${0.55*fade})`);
      bg.addColorStop(1, `rgba(140,240,200,0)`);
      ctx.fillStyle = bg;
      ctx.beginPath();
      ctx.moveTo(shipX - 16, shipY + bob + 8);
      ctx.lineTo(shipX + 16, shipY + bob + 8);
      ctx.lineTo(shipX + 62, groundY);
      ctx.lineTo(shipX - 62, groundY);
      ctx.closePath(); ctx.fill();
      // rising motes
      ctx.fillStyle = `rgba(220,255,240,${0.7*fade})`;
      for (let i=0;i<9;i++){
        const mp = ((a.t*0.5 + i*0.11) % 1);
        const my = groundY - mp*(groundY - shipY - 20);
        const spread = 46*(1-mp) + 8;
        const mx = shipX + Math.sin(i*2.3 + a.t*2)*spread;
        ctx.beginPath(); ctx.arc(mx, my, 2.2, 0, 6.28); ctx.fill();
      }
    }
    // saucer
    ctx.translate(shipX, shipY + bob);
    ctx.fillStyle = "rgba(160,255,220,.18)";
    ctx.beginPath(); ctx.ellipse(0, 0, 74, 30, 0, 0, 6.28); ctx.fill();
    // dome
    ctx.fillStyle = "#9fe8ff";
    ctx.beginPath(); ctx.ellipse(0, -8, 22, 18, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,.45)";
    ctx.beginPath(); ctx.ellipse(-7, -14, 6, 5, -0.4, 0, 6.28); ctx.fill();
    // hull
    ctx.fillStyle = "#7f8aa8";
    ctx.beginPath(); ctx.ellipse(0, 0, 54, 15, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = "#5d6781";
    ctx.beginPath(); ctx.ellipse(0, 5, 42, 9, 0, 0, 6.28); ctx.fill();
    // running lights
    for (let i=0;i<7;i++){
      const ang = a.t*2.2 + i*0.9;
      const lx = Math.cos(ang)*44;
      const on = Math.sin(a.t*6 + i) > -0.2;
      ctx.fillStyle = on ? "#8cf0c8" : "#3f6a5c";
      ctx.beginPath(); ctx.arc(lx, 6 + Math.sin(ang)*3, 3.4, 0, 6.28); ctx.fill();
    }
  } else if (a.kind === "tramp"){
    const gy = L.yToPx(a.yw) + 10;
    const slideP = Math.min(1, a.t/0.32);
    const sx = a.n.px + (1 - easeOut(slideP)) * 140;
    const fade = a.t > 1.1 ? Math.max(0, 1 - (a.t - 1.1)/0.4) : 1;
    const squash = (a.launched && a.t < 0.65) ? 0.45 : 1;
    ctx.globalAlpha = fade;
    ctx.translate(sx, gy);
    // legs
    ctx.strokeStyle = "#8a8fa8"; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-18, 2); ctx.lineTo(-24, 12); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(18, 2); ctx.lineTo(24, 12); ctx.stroke();
    // springs
    ctx.strokeStyle = "#5a608a"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-12, 0); ctx.lineTo(-12, 6); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(12, 6); ctx.stroke();
    // mat
    ctx.fillStyle = "#3a7bd5";
    ctx.beginPath(); ctx.ellipse(0, 0, 28, 7*squash, 0, 0, 6.28); ctx.fill();
    ctx.strokeStyle = "#78b0f0"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.ellipse(0, 0, 28, 7*squash, 0, 0, 6.28); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  ctx.restore();
}

function roundRect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ---------------- loop ---------------- */
function frame(now){
  const dt = Math.min(0.05, (now - t0)/1000);
  t0 = now;
  update(dt);
  draw();
  requestAnimationFrame(frame);
}

/* ---------------- events ---------------- */
startBtn.addEventListener("click", startRace);
againBtn.addEventListener("click", confirmWinner);
resetBtn.addEventListener("click", resetAll);
wallSelect.addEventListener("change", () => {
  if (wallSelect.value !== "random") themeKey = wallSelect.value;
});

rosterBtn.addEventListener("click", () => {
  rosterText.value = roster.join("\n");
  rosterOverlay.classList.remove("hidden");
  rosterText.focus();
});
rosterCancel.addEventListener("click", () => rosterOverlay.classList.add("hidden"));
rosterSave.addEventListener("click", () => {
  const names = rosterText.value.split("\n").map(s => s.trim()).filter(Boolean);
  if (names.length){ roster = names.slice(0, 24); }
  rosterOverlay.classList.add("hidden");
  resetAll();
});

/* ---------------- go ---------------- */
resize();
setupRound();
updateHUD();
requestAnimationFrame(frame);
})();
</script>
